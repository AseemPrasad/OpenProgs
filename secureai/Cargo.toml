[package]
name = "secureai"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3.8"

[dependencies]
# Core CLI and Async
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.32", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization/Policy
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# Identity & Crypto
tss-esapi = "7.2" # TPM 2.0
jsonwebtoken = "9.1"
uuid = { version = "1.4", features = ["v4"] }

# LLM Integration
ollama-rs = "0.1"

# Firecracker/Sandbox (Experimental/SDK)
# Note: In a real production setup, we'd use the firecracker-sdk or
# call the binary via command line for simpler orchestration in MVP.
# Using a mock-compatible interface for this prototype.
reqwest = { version = "0.11", features = ["json"] } # To talk to Firecracker API

# Kernel LSM & Isolation (Linux)
landlock = "0.3"
caps = "0.5"
nix = { version = "0.27", features = ["process"] }
seccompiler = "0.3"

# gRPC Control Plane
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
tonic-build = { version = "0.11", optional = true }
arc-swap = "1.6"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Semantic Guardrails
ort = "2.0"
ndarray = "0.15"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }
lazy_static = "1.4"

# Async Stream Proxy
axum = "0.7"
hyper = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tiktoken-rs = "0.5"
bytes = "1.5"
parking_lot = "0.12"
futures-util = "0.3"

# Multi-Model Router
reqwest = { version = "0.11", features = ["json"] }
num_cpus = "1.16"
atomic_float = "1.1"

# Cryptographic Audit & Telemetry
ed25519-dalek = "2.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
opentelemetry = "0.20"
opentelemetry-otlp = "0.13"
opentelemetry-proto = "0.20"
tracing-opentelemetry = "0.21"
tokio-util = "0.7"
